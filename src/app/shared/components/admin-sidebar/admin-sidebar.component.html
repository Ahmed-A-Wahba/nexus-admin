<!-- Fixed Left Sidebar -->
<aside class="w-64 fixed top-0 bottom-0 left-0 bg-[#0D0D19]/95 backdrop-blur-xl border-r border-white/[0.08] flex flex-col justify-between z-30 select-none">
  
  <!-- Top Branding & Nav Links -->
  <div class="p-6">
    
    <!-- Brand Logo -->
    <div class="flex items-center gap-2.5 mb-8">
      <span class="text-2xl font-extrabold font-sora tracking-tight text-[#D2BBFF]">
        NEXUS
      </span>
      <span class="px-2 py-0.5 rounded bg-purple-950/40 border border-purple-400/20 text-[10px] font-mono tracking-[0.15em] text-[#D2BBFF] font-bold uppercase">
        ADMIN
      </span>
    </div>

    <!-- Navigation Sections -->
    <nav class="space-y-6">
      
      <!-- Section: Overview -->
      <div>
        <p class="text-[10px] font-mono font-bold tracking-[0.15em] text-zinc-500 uppercase mb-2.5 px-3">
          OVERVIEW
        </p>
        <div class="space-y-1">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-[#D2BBFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
            </svg>
            <span>Dashboard</span>
          </a>
        </div>
      </div>

      <!-- Section: Management -->
      <div>
        <p class="text-[10px] font-mono font-bold tracking-[0.15em] text-zinc-500 uppercase mb-2.5 px-3">
          MANAGEMENT
        </p>
        <div class="space-y-1">
          <a
            routerLink="/publishers"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0V10m0 0h5m-5 0H7"></path>
            </svg>
            <span>Publishers</span>
          </a>

          <a
            routerLink="/offers"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Offers</span>
          </a>

          <a
            routerLink="/redeem-codes"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
            </svg>
            <span>Redeem Codes</span>
          </a>

          <a
            routerLink="/users"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Users</span>
          </a>
        </div>
      </div>

      <!-- Section: Finance -->
      <div>
        <p class="text-[10px] font-mono font-bold tracking-[0.15em] text-zinc-500 uppercase mb-2.5 px-3">
          FINANCE
        </p>
        <div class="space-y-1">
          <a
            routerLink="/payouts"
            routerLinkActive="bg-[#7C3AED]/20 border-[#7C3AED]/40 text-white font-semibold shadow-[0_0_15px_rgba(124,58,237,0.2)]"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-transparent text-sm text-zinc-400 hover:text-white hover:bg-white/5 transition-all"
          >
            <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span>Payouts</span>
          </a>
        </div>
      </div>

    </nav>

  </div>

  <!-- Bottom User Info & Logout -->
  <div class="p-4 border-t border-white/[0.08] bg-white/[0.02]">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-full bg-[#7C3AED]/30 border border-[#7C3AED]/50 flex items-center justify-center text-xs font-bold text-[#D2BBFF] shrink-0">
          {{ adminInitial() }}
        </div>
        <div class="truncate">
          <p class="text-xs font-semibold text-white truncate">{{ adminEmail() || 'Loading...' }}</p>
          <p class="text-[10px] text-zinc-400 font-mono">Super Admin</p>
        </div>
      </div>

      <button
        (click)="logout()"
        title="Logout"
        class="p-2 rounded-lg text-zinc-400 hover:text-red-400 hover:bg-red-500/10 transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>
    </div>
  </div>

</aside>
