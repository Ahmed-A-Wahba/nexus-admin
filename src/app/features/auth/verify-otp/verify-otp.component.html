<div class="min-h-screen bg-gradient-to-b from-[#070510] via-[#0A0716] to-[#0D0817] flex flex-col justify-center items-center px-4 py-12 relative overflow-hidden select-none">

  <!-- Ambient Off-canvas Glowing Orbs -->
  <div class="absolute top-[-150px] left-[-150px] w-[600px] h-[600px] rounded-full bg-[#7C3AED]/15 blur-[140px] pointer-events-none"></div>
  <div class="absolute bottom-[-150px] right-[-150px] w-[600px] h-[600px] rounded-full bg-[#7C3AED]/15 blur-[140px] pointer-events-none"></div>

  <!-- Main Container -->
  <div class="w-full max-w-[512px] relative z-10 flex flex-col items-center">

    <!-- Elevated Dark Glassmorphic Card -->
    <div class="w-full bg-[#110E20]/90 backdrop-blur-xl border border-white/[0.08] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)] rounded-2xl p-7 md:p-10 relative flex flex-col items-center">
      
      <!-- Back Arrow Link -->
      <a routerLink="/login" class="absolute top-5 left-5 flex items-center gap-1.5 text-xs text-zinc-400 hover:text-white transition-colors cursor-pointer group">
        <svg class="w-4 h-4 text-zinc-400 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span>Back</span>
      </a>

      <!-- Logo & Badge Header -->
      <div class="flex items-center gap-2 mb-6 mt-2">
        <span class="text-2xl font-extrabold font-sora tracking-tight text-[#D2BBFF]">
          NEXUS
        </span>
        <span class="px-2 py-0.5 rounded bg-purple-950/40 border border-purple-400/20 text-[10px] font-mono tracking-[0.1em] text-[#D2BBFF] font-bold uppercase">
          ADMIN
        </span>
      </div>

      <!-- Shield / Lock Circular Badge -->
      <div class="w-16 h-16 rounded-full bg-[#7C3AED]/20 border border-[#7C3AED]/35 flex items-center justify-center shadow-[0_0_25px_rgba(124,58,237,0.25)] mb-5">
        <svg class="w-7 h-7 text-[#D2BBFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>

      <!-- Titles -->
      <div class="text-center mb-7">
        <h1 class="text-2xl md:text-3xl font-extrabold font-sora text-[#E3E0F2] mb-2 tracking-tight">
          Verify Your Identity
        </h1>
        <p class="text-xs md:text-sm text-zinc-400 font-inter leading-relaxed max-w-sm">
          We sent a 6-digit code to your email
          <span class="block mt-1 font-mono font-medium text-[#D2BBFF] text-sm">{{ maskedEmail }}</span>
        </p>
      </div>

      <!-- Error Message Banner -->
      @if (errorMessage) {
        <div class="w-full mb-6 p-3 rounded-xl bg-red-500/10 border border-red-500/25 text-red-300 text-xs flex items-start gap-2.5 animate-fade-in">
          <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span class="leading-relaxed">{{ errorMessage }}</span>
        </div>
      }

      <!-- Success Message Banner -->
      @if (successMessage) {
        <div class="w-full mb-6 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 text-xs flex items-start gap-2.5 animate-fade-in">
          <svg class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <span class="leading-relaxed">{{ successMessage }}</span>
        </div>
      }

      <!-- OTP Form Section -->
      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="w-full space-y-6">
        
        <!-- 6-Digit OTP Inputs Row -->
        <div class="flex items-center justify-between gap-2 md:gap-3" (paste)="onPaste($event)">
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit0"
            (input)="onInput($event, 0)"
            (keydown)="onKeyDown($event, 0)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit1"
            (input)="onInput($event, 1)"
            (keydown)="onKeyDown($event, 1)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit2"
            (input)="onInput($event, 2)"
            (keydown)="onKeyDown($event, 2)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit3"
            (input)="onInput($event, 3)"
            (keydown)="onKeyDown($event, 3)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit4"
            (input)="onInput($event, 4)"
            (keydown)="onKeyDown($event, 4)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
          <input
            #otpInput
            type="text"
            inputmode="numeric"
            maxlength="1"
            formControlName="digit5"
            (input)="onInput($event, 5)"
            (keydown)="onKeyDown($event, 5)"
            class="w-11 h-13 md:w-14 md:h-14 font-mono font-bold text-xl md:text-2xl text-center text-[#D2BBFF] bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#7C3AED] focus:bg-[#7C3AED]/15 focus:shadow-[0_0_20px_rgba(124,58,237,0.4)] transition-all"
          />
        </div>

        <!-- Verify Button -->
        <button
          type="submit"
          [disabled]="isLoading || !isOtpComplete"
          class="w-full h-14 btn-purple-glow py-3 px-4 rounded-xl font-sora font-semibold text-base text-[#EDE0FF] flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed transition-all"
        >
          @if (isLoading) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Verifying Code...</span>
          } @else {
            <span>Verify Code</span>
            <svg class="w-5 h-5 text-[#D2BBFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          }
        </button>

      </form>

      <!-- Actions & Info Section -->
      <div class="mt-7 flex flex-col items-center gap-3 w-full text-center">
        <!-- Expiration Timer -->
        <div class="flex items-center gap-1.5 text-xs text-zinc-400 font-inter">
          <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Code expires in <strong class="font-mono text-[#D2BBFF] font-semibold">{{ formattedTimer }}</strong></span>
        </div>

        <!-- Resend Code -->
        <p class="text-xs text-zinc-400 font-inter">
          Didn't receive the code?
          <button
            type="button"
            (click)="resendCode()"
            [disabled]="isLoading || isResending"
            class="text-[#D2BBFF] hover:text-white font-semibold underline underline-offset-2 ml-1 cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-1"
          >
            @if (isResending) {
              <svg class="animate-spin h-3 w-3 text-[#D2BBFF]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Sending...</span>
            } @else {
              <span>Resend</span>
            }
          </button>
        </p>
      </div>

    </div>

    <!-- Outside Footer -->
    <p class="mt-8 text-center text-zinc-500/70 text-[11px] font-inter">
      © 2026 NEXUS Technology Hub. Internal use only.
    </p>

  </div>

</div>
